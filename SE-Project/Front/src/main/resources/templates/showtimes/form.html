<!DOCTYPE html>
<html lang="en" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Showtime Form')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container my-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h2 class="mb-4" th:text="${showtimeForm.id != null} ? 'Edit Showtime' : 'New Showtime'">Showtime Form</h2>

            <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}">Error</div>

            <form th:action="${showtimeForm.id != null} ? @{/manager/showtimes/{id}/edit(id=${showtimeForm.id})} : @{/manager/showtimes/new}"
                  th:object="${showtimeForm}" method="post">
                <input type="hidden" th:field="*{id}">
                <div class="mb-3">
                    <label class="form-label">Movie</label>
                    <select th:field="*{movieId}" class="form-select">
                        <option th:each="m : ${movies}" th:value="${m.id}" th:text="${m.title}"></option>
                    </select>
                    <div class="text-danger small" th:if="${#fields.hasErrors('movieId')}" th:errors="*{movieId}"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Cinema Hall</label>
                    <select th:field="*{cinemaHallId}" class="form-select">
                        <option th:each="h : ${halls}" th:value="${h.id}" th:text="${h.name}"></option>
                    </select>
                    <div class="text-danger small" th:if="${#fields.hasErrors('cinemaHallId')}" th:errors="*{cinemaHallId}"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Date &amp; Time</label>
                    <input type="datetime-local" th:field="*{dateTime}" class="form-control">
                    <div class="text-danger small" th:if="${#fields.hasErrors('dateTime')}" th:errors="*{dateTime}"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Price (Rs.)</label>
                    <input type="number" step="0.01" th:field="*{price}" class="form-control">
                    <div class="text-danger small" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
                </div>
                <button type="submit" class="btn btn-primary">Save</button>
                <a class="btn btn-outline-secondary" th:href="@{/manager/showtimes}">Cancel</a>
            </form>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
