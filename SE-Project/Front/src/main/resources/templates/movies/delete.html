<!DOCTYPE html>
<html lang="en" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Delete Movie')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container my-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h2 class="mb-4">Delete Movie</h2>
            <p>Are you sure you want to delete <strong th:text="${movie.title}">Title</strong>? This cannot be undone.</p>
            <form th:action="@{/manager/movies/{id}/delete(id=${movie.id})}" method="post">
                <button type="submit" class="btn btn-danger">Yes, delete</button>
                <a class="btn btn-outline-secondary" th:href="@{/manager/movies}">Cancel</a>
            </form>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
