<!DOCTYPE html>
<html lang="en" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Food Item Form')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container my-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h2 class="mb-4" th:text="${foodItem.id != null} ? 'Edit Food Item' : 'New Food Item'">Food Item Form</h2>

            <form th:action="${foodItem.id != null} ? @{/manager/food/{id}/edit(id=${foodItem.id})} : @{/manager/food/new}"
                  th:object="${foodItem}" method="post">
                <input type="hidden" th:field="*{id}">
                <div class="mb-3">
                    <label class="form-label" for="name">Name</label>
                    <input type="text" th:field="*{name}" class="form-control" placeholder="e.g. Large Popcorn" required>
                    <div class="text-danger small" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="category">Category</label>
                    <select th:field="*{category}" class="form-select">
                        <option th:each="c : ${categories}" th:value="${c}" th:text="${c.displayLabel}">Snack</option>
                    </select>
                    <div class="text-danger small" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="price">Price (Rs.)</label>
                    <input type="number" step="0.01" min="0.01" th:field="*{price}" class="form-control" placeholder="e.g. 650.00" required>
                    <div class="text-danger small" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="imageUrl">Image URL <span class="text-muted">(optional)</span></label>
                    <input type="text" th:field="*{imageUrl}" class="form-control" placeholder="/images/food/nachos.jpg or https://...">
                    <div class="form-text">Shown on the Food &amp; Drinks menu. Leave empty for a placeholder.</div>
                    <div class="text-danger small" th:if="${#fields.hasErrors('imageUrl')}" th:errors="*{imageUrl}"></div>
                </div>
                <p class="form-text">Saving sends the item for System Admin approval (unless you are the System Admin).</p>
                <button type="submit" class="btn btn-primary">Save</button>
                <a class="btn btn-outline-secondary" th:href="@{/manager/food}">Cancel</a>
            </form>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
